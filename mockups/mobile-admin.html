<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100 text-slate-800">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafePassage | SecOps Mobile Pocket Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .mobile-frame {
      width: 380px;
      height: 720px;
      max-height: calc(100vh - 120px);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.18), 0 0 0 10px #ffffff, 0 0 0 12px #e2e8f0;
      border-radius: 44px;
      background: #ffffff;
      position: relative;
    }
    .mobile-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 24px;
      background: #0f172a;
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>
<body class="min-h-full flex flex-col items-center justify-start p-4 md:p-6 bg-slate-100 overflow-y-auto">
  <div class="mb-4 flex items-center gap-4 shrink-0">
    <a href="../index.html" class="px-3.5 py-1.5 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold rounded-xl flex items-center gap-2 shadow-sm">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Simulator Suite
    </a>
  </div>

  <div class="mobile-frame border border-slate-200 flex flex-col overflow-hidden relative shadow-2xl">
    <!-- Speaker Notch -->
    <div class="mobile-notch">
      <div class="w-3 h-3 rounded-full bg-slate-800 border border-slate-700"></div>
      <div class="w-10 h-1.5 rounded-full bg-slate-800"></div>
    </div>

    <!-- Phone Status Bar (Below Notch) -->
    <div class="pt-7 px-6 pb-2 flex justify-between text-[11px] font-bold text-slate-700 select-none">
      <span>04:25</span>
      <div class="flex items-center gap-1.5">
        <i data-lucide="wifi" class="w-3.5 h-3.5 text-slate-600"></i>
        <i data-lucide="battery" class="w-4 h-4 text-emerald-600"></i>
      </div>
    </div>

    <!-- Admin Mobile Header -->
    <div class="p-4 border-b border-slate-100 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-rose-600 flex items-center justify-center text-white font-bold">
          <i data-lucide="shield-alert" class="w-4 h-4"></i>
        </div>
        <div>
          <h2 class="font-bold text-xs text-slate-900">SafePassage SecOps</h2>
          <p class="text-[9px] text-amber-600 font-bold">Pocket Admin Console</p>
        </div>
      </div>
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
    </div>

    <!-- Mobile Admin Body -->
    <div class="flex-1 p-4 space-y-4 overflow-y-auto bg-slate-50">
      <!-- Status Card -->
      <div class="p-4 bg-white border border-slate-200 rounded-2xl space-y-2 shadow-sm">
        <span class="text-[10px] font-bold text-slate-400 uppercase">IAM Infrastructure Status</span>
        <div class="flex items-center justify-between">
          <span class="text-xs text-slate-700 font-semibold">Active Sessions:</span>
          <span class="text-xs font-bold font-mono text-indigo-600">1,240 Active</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-xs text-slate-700 font-semibold">Auth Gateway Latency:</span>
          <span class="text-xs font-bold font-mono text-emerald-600">38ms</span>
        </div>
      </div>

      <!-- Critical Incident Card -->
      <div class="p-4 bg-rose-50 border border-rose-200 rounded-2xl space-y-3 shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-rose-900 flex items-center gap-1.5">
            <i data-lucide="alert-triangle" class="w-4 h-4 text-rose-600"></i> Suspicious Brute-Force
          </span>
          <span class="text-[9px] font-bold bg-rose-600 text-white px-1.5 py-0.5 rounded">P1 CRITICAL</span>
        </div>
        <p class="text-xs text-rose-800">Target: <strong class="text-rose-950">alex.turner@campus.edu</strong><br>Origin: 185.220.101.5 (Tor Exit)</p>
        <button onclick="alert('Account Locked & Active OAuth tokens terminated!')" class="w-full py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl shadow-sm transition-all">
          Emergency Lock Account
        </button>
      </div>

      <!-- Quick Directory Search -->
      <div class="space-y-2 pt-1">
        <span class="text-xs font-bold text-slate-700">Quick User Unlock</span>
        <input type="text" placeholder="Type username or student ID..." class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs text-slate-800 placeholder-slate-400" />
      </div>
    </div>

    <!-- Bottom Bar -->
    <div class="p-3 border-t border-slate-100 bg-white flex justify-around text-slate-500 text-[10px]">
      <div class="flex flex-col items-center text-rose-600 font-bold">
        <i data-lucide="shield-alert" class="w-4 h-4"></i>
        <span>SecOps</span>
      </div>
      <div class="flex flex-col items-center hover:text-indigo-600 font-bold">
        <i data-lucide="users" class="w-4 h-4"></i>
        <span>Users</span>
      </div>
      <div class="flex flex-col items-center hover:text-indigo-600 font-bold">
        <i data-lucide="activity" class="w-4 h-4"></i>
        <span>SIEM Stream</span>
      </div>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
