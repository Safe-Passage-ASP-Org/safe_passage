name: CI/CD

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

jobs:
  backend-and-web:
    name: Build & Test .NET (API + Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: |
          dotnet restore backend/SafePassage.Api.csproj
          dotnet restore backend-tests/SafePassage.Api.Tests/SafePassage.Api.Tests.csproj
          dotnet restore frontend-web/SafePassage.Web.csproj

      - name: Build & Test Backend
        run: dotnet test backend-tests/SafePassage.Api.Tests/SafePassage.Api.Tests.csproj --configuration Release --no-restore

      - name: Publish Frontend Web
        run: dotnet publish frontend-web/SafePassage.Web.csproj --configuration Release --no-restore --output ./out/web

  mobile:
    name: Test Mobile & Verify Vercel Web Export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Export Web bundle (Vercel build check)
        env:
          EXPO_PUBLIC_API_URL: https://safe-passage-api.onrender.com
        run: npx expo export --platform web

  docker:
    name: Verify Render Docker Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Docker image
        run: docker build -f backend/Dockerfile -t safepassage-api:ci .

      - name: Build Frontend Web Docker image
        run: |
          docker build -f frontend-web/Dockerfile -t safepassage-web:ci .
          cid=$(docker run -d -p 10000:10000 -e ASPNETCORE_ENVIRONMENT=Production safepassage-web:ci)
          sleep 3
          code=$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:10000/_framework/blazor.web.js || echo "000")
          docker rm -f "$cid" || true
          echo "docker-blazor-js: $code"
          test "$code" = "200"

  verify-live-deployments:
    name: Verify Live Deployments
    needs: [backend-and-web, mobile, docker]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check Backend API, Admin Web, and Mobile Web
        run: |
          check_url() {
            local url="$1"
            for i in $(seq 1 18); do
              code=$(curl -sS -L -m 20 -o /dev/null -w "%{http_code}" "$url" || echo "000")
              if [ "$code" = "200" ]; then
                echo "OK ($code): $url"
                return 0
              fi
              echo "Attempt $i/18 for $url returned $code; retrying in 10s..."
              sleep 10
            done
            echo "FAILED: $url did not return 200"
            return 1
          }

          check_url "https://safe-passage-api.onrender.com/api/status"
          check_url "https://safe-passage-web.onrender.com/"
          check_url "https://safepassage-mobile.vercel.app/"

          status_json=$(curl -fsS -m 20 "https://safe-passage-api.onrender.com/api/status" || echo "{}")
          live_commit=$(echo "$status_json" | jq -r '.commit // "unknown"')

          {
            echo "## Deployment Verification Summary"
            echo ""
            echo "| Service | URL | Status |"
            echo "|---|---|---|"
            echo "| Backend API (Render) | https://safe-passage-api.onrender.com/api/status | Passed (HTTP 200) |"
            echo "| Admin Web (Render) | https://safe-passage-web.onrender.com/ | Passed (HTTP 200) |"
            echo "| Mobile Web (Vercel) | https://safepassage-mobile.vercel.app/ | Passed (HTTP 200) |"
            echo ""
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **Expected Commit:** \`${{ github.sha }}\`"
            echo "- **Live Backend Commit:** \`${live_commit}\`"
            if [ "$live_commit" != "${{ github.sha }}" ] && [ "$live_commit" != "unknown" ] && [ "$live_commit" != "local" ]; then
              echo "- **Note:** Render is still serving an earlier commit (\`${live_commit}\`) while \`${{ github.sha }}\` rolls out or if the new deploy failed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
