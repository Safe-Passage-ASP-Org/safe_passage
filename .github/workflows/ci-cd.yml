name: CI/CD

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  backend-and-web:
    name: Build & Test .NET (API + Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: |
          dotnet restore backend/SafePassage.Api.csproj
          dotnet restore backend-tests/SafePassage.Api.Tests/SafePassage.Api.Tests.csproj
          dotnet restore frontend-web/SafePassage.Web.csproj

      - name: Build & Test Backend
        run: dotnet test backend-tests/SafePassage.Api.Tests/SafePassage.Api.Tests.csproj --configuration Release --no-restore

      - name: Build Frontend Web
        run: dotnet build frontend-web/SafePassage.Web.csproj --configuration Release --no-restore

  mobile:
    name: Test Mobile & Export Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
