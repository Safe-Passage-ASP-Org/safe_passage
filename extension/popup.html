<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Safe Passage</title>
  <style>
    body { width: 320px; margin: 0; padding: 14px; background: #111315; color: #e6e8eb; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: #939aa3; margin: 14px 0 6px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 11px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #262a30; background: #171a1e; color: #e6e8eb; font-size: 12px; }
    button { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #2e343b; background: #1d4ed8; color: #fff; font-weight: 600; cursor: pointer; font-size: 12px; }
    button.secondary { background: #171a1e; color: #e6e8eb; }
    button.danger { background: #7f1d1d; border-color: #991b1b; padding: 4px 8px; width: auto; font-size: 11px; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .status { font-size: 12px; margin: 6px 0; color: #939aa3; }
    .site-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #262a30; }
    .site-info { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .site-section { margin-top: 15px; padding: 12px; border: 1px solid #26352f; border-radius: 9px; background: #111a17; }
    .site-section h2 { margin-top: 0; }
    .site-label { display: block; margin: 11px 0 6px; color: #aab4bf; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .site-domain { display: block; overflow: hidden; padding: 10px 11px; border-radius: 8px; background: #171a1e; color: #e6e8eb; text-overflow: ellipsis; white-space: nowrap; }
    .password-field { display: flex; gap: 6px; align-items: stretch; }
    .password-field input { min-width: 0; flex: 1; }
    .password-toggle { width: auto; min-width: 48px; margin-bottom: 8px; padding: 0 10px; background: #171a1e; }
    .approval-copy { margin: 0 0 10px; color: #aab4bf; font-size: 11px; line-height: 1.45; }
    .section-title { margin: 18px 0 6px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Safe Passage</h1>
  <div id="statusMsg" class="status">Loading...</div>

  <div id="loginView" class="hidden">
    <input id="apiUrl" type="url" placeholder="https://safe-passage-api.onrender.com" />
    <input id="loginUser" type="text" placeholder="Safe Passage username or email" />
    <input id="loginPass" type="password" placeholder="Safe Passage password" />
    <button id="loginBtn" type="button">Sign in &amp; Wait for MFA</button>
  </div>

  <div id="signedInView" class="hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span id="userLabel" style="font-weight:600;"></span>
      <button id="logoutBtn" type="button" class="secondary" style="width:auto;padding:4px 10px;">Lock extension</button>
    </div>

    <section class="site-section">
      <h2>Safe Passage Approval</h2>
      <p class="approval-copy">Approve this site's sign-in on your trusted Safe Passage mobile device.</p>
      <span id="currentSiteLabel" class="site-domain">Open a website to continue</span>
      <button id="autofillTabBtn" type="button" style="margin-top:10px;">Request mobile approval</button>
    </section>

    <h2 class="section-title">Add Credential for This Site</h2>
    <label class="site-label" for="siteName">Label</label>
    <input id="siteName" type="text" placeholder="Site name" />
    <label class="site-label" for="siteOrigin">Login/Web URL</label>
    <input id="siteOrigin" type="url" placeholder="https://example.com" />
    <label class="site-label" for="siteCategory">Category</label>
    <select id="siteCategory" aria-label="Category"><option>Other</option><option>Work</option><option>Social</option><option>Finance</option><option>Education</option><option>Shopping</option><option>Entertainment</option><option>Health</option></select>
    <label class="site-label" for="siteDescription">Description (Optional)</label>
    <input id="siteDescription" type="text" maxlength="2000" placeholder="Short description" />
    <label class="site-label" for="siteUser">Username / Email</label>
    <input id="siteUser" type="text" autocomplete="off" placeholder="Your login" />
    <label class="site-label" for="sitePass">Password</label>
    <div class="password-field">
      <input id="sitePass" type="password" autocomplete="new-password" placeholder="Your password" />
      <button id="togglePassword" class="password-toggle secondary" type="button" aria-label="Show password">Show</button>
    </div>
    <label class="site-label" for="siteTotpSecret">2FA Secret (Base32, Optional)</label>
    <input id="siteTotpSecret" type="password" autocomplete="off" placeholder="Enter the authenticator setup key" />
    <p class="approval-copy">Credentials and 2FA stay unavailable until an administrator verifies this site.</p>
    <button id="saveSiteBtn" type="button" class="secondary">Save credentials for this site</button>

    <h2 class="section-title">Saved Sites</h2>
    <div id="sitesList"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
