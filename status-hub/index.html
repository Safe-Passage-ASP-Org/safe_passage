<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Safe Passage | Deployment Status</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111315;
      --card: #171a1e;
      --border: #262a30;
      --text: #e6e8eb;
      --muted: #939aa3;
      --ok: #4ade80;
      --ok-bg: rgba(74, 222, 128, 0.10);
      --warn: #fbbf24;
      --warn-bg: rgba(251, 191, 36, 0.10);
      --fail: #f87171;
      --fail-bg: rgba(248, 113, 113, 0.10);
      --link: #93c5fd;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; }
    .container { max-width: 960px; margin: 0 auto; padding: 32px 20px 56px; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 1.35rem; font-weight: 600; letter-spacing: -0.015em; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 0.875rem; }
    button { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; font-size: 0.85rem; font-weight: 500; cursor: pointer; }
    button:hover { border-color: #4b5563; }
    button:disabled { opacity: 0.55; cursor: wait; }

    .summary { border-radius: 10px; padding: 14px 18px; margin-bottom: 24px; border: 1px solid var(--border); background: var(--card); }
    .summary.ok { border-left: 3px solid var(--ok); }
    .summary.warn { border-left: 3px solid var(--warn); }
    .summary.fail { border-left: 3px solid var(--fail); }
    .summary-title { font-weight: 600; font-size: 0.95rem; margin: 0 0 4px; }
    .summary-desc { margin: 0; font-size: 0.875rem; color: var(--muted); }

    .section-title { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; margin-bottom: 26px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .card-title { font-weight: 600; font-size: 0.95rem; margin: 0; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.02em; }
    .pill.ok { background: var(--ok-bg); color: var(--ok); }
    .pill.warn { background: var(--warn-bg); color: var(--warn); }
    .pill.fail { background: var(--fail-bg); color: var(--fail); }

    .meta { font-size: 0.84rem; color: var(--muted); display: grid; gap: 6px; }
    .meta code { color: var(--text); background: rgba(255, 255, 255, 0.05); padding: 1px 5px; border-radius: 4px; font-size: 0.78rem; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .job-list { margin: 8px 0 0; padding-left: 16px; font-size: 0.82rem; color: var(--muted); }
    .job-list li.fail { color: var(--fail); }
    .footer { margin-top: 12px; font-size: 0.78rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Safe Passage Deployment Status</h1>
        <p class="subtitle">Simple view of live services, CI/CD runs, and commit sync for <code>Safe-Passage-ASP-Org/safe_passage</code></p>
      </div>
      <button id="refreshBtn" onclick="loadStatus()">Refresh</button>
    </header>

    <div id="overallSummary" class="summary">Checking deployments and CI/CD...</div>

    <h2 class="section-title">Live Services</h2>
    <div id="servicesGrid" class="grid"></div>

    <h2 class="section-title">Branches &amp; CI/CD</h2>
    <div id="branchesGrid" class="grid"></div>

    <div id="checkedAt" class="footer"></div>
  </div>

  <script>
    let refreshTimer = null;
    let tickTimer = null;
    let lastCheckedIso = null;
    let lastHasActiveRun = false;

    function esc(str) {
      return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function timeAgo(iso) {
      if (!iso) return '';
      const diffSec = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
      if (diffSec < 60) return `${diffSec}s ago`;
      const mins = Math.floor(diffSec / 60);
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    function updateFooter() {
      if (!lastCheckedIso) return;
      document.getElementById('checkedAt').textContent =
        `Last checked: ${timeAgo(lastCheckedIso)} (${new Date(lastCheckedIso).toLocaleTimeString()}, auto-refreshes every ${lastHasActiveRun ? '30' : '60'}s)`;
    }

    function scheduleRefresh(hasActiveRun) {
      if (refreshTimer) clearTimeout(refreshTimer);
      refreshTimer = setTimeout(loadStatus, hasActiveRun ? 30000 : 60000);
      if (!tickTimer) {
        tickTimer = setInterval(updateFooter, 1000);
      }
    }

    async function loadStatus() {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        lastCheckedIso = data.checkedAt;
        lastHasActiveRun = Boolean(data.hasActiveRun);
        render(data);
        updateFooter();
        scheduleRefresh(lastHasActiveRun);
      } catch (err) {
        document.getElementById('overallSummary').className = 'summary fail';
        document.getElementById('overallSummary').innerHTML = `<p class="summary-title">Unable to check status</p><p class="summary-desc">${esc(err.message)}</p>`;
        scheduleRefresh(false);
      } finally {
        btn.disabled = false;
      }
    }

    function render(data) {
      const dev = data.branches.development;
      const latestSha = dev.commit?.sha || '';
      const latestShort = dev.commit?.shortSha || '';
      const activeRun = dev.activeRun;
      const lastRun = dev.latestCompletedRun;

      const summary = document.getElementById('overallSummary');
      const downServices = data.services.filter((s) => !s.ok);
      const behindServices = latestSha
        ? data.services.filter((s) => s.commit && s.commit !== 'local' && s.commit !== latestSha)
        : [];

      if (downServices.length > 0) {
        summary.className = 'summary fail';
        summary.innerHTML = `
          <p class="summary-title">A service is offline</p>
          <p class="summary-desc">${downServices.map((s) => esc(s.name)).join(', ')} did not respond with HTTP 200.</p>`;
      } else if (activeRun) {
        const doneCount = (activeRun.jobs || []).filter((j) => j.status === 'completed').length;
        const totalCount = (activeRun.jobs || []).length;
        summary.className = 'summary warn';
        summary.innerHTML = `
          <p class="summary-title">Build in progress for ${esc(activeRun.shortSha)} (${esc(timeAgo(activeRun.updatedAt))})</p>
          <p class="summary-desc">
            CI/CD is currently running (${doneCount}/${totalCount} jobs finished). Live services stay online while this finishes.
            <a href="${esc(activeRun.url)}" target="_blank" rel="noopener">View live run</a>
          </p>`;
      } else if (lastRun && lastRun.conclusion === 'failure') {
        const jobsText = (lastRun.failedJobs || []).map((j) => `${j.name}${j.failedSteps.length ? ` (${j.failedSteps.join(', ')})` : ''}`).join('; ');
        summary.className = 'summary fail';
        summary.innerHTML = `
          <p class="summary-title">Latest code (${esc(latestShort || lastRun.shortSha)}) has an error (${esc(timeAgo(lastRun.updatedAt))})</p>
          <p class="summary-desc">
            Live services stayed on the previous working build.
            ${jobsText ? `Failed in: <strong>${esc(jobsText)}</strong>. ` : ''}
            <a href="${esc(lastRun.url)}" target="_blank" rel="noopener">Open error logs</a>
          </p>`;
      } else if (behindServices.length > 0) {
        summary.className = 'summary warn';
        summary.innerHTML = `
          <p class="summary-title">Commit ${esc(latestShort)} passed CI — rollout in progress</p>
          <p class="summary-desc">${behindServices.map((s) => `${esc(s.name)} is still serving ${esc(s.commit.slice(0, 7))}`).join(' | ')}</p>`;
      } else {
        summary.className = 'summary ok';
        summary.innerHTML = `
          <p class="summary-title">Everything is online${latestShort ? ` and running the latest commit (${esc(latestShort)})` : ''}</p>
          <p class="summary-desc">All services returned HTTP 200${dev.commit?.date ? ` · latest commit ${esc(timeAgo(dev.commit.date))}` : ''}.</p>`;
      }

      document.getElementById('servicesGrid').innerHTML = data.services.map((s) => {
        const isBehind = Boolean(latestSha && s.commit && s.commit !== 'local' && s.commit !== latestSha);
        const pillClass = !s.ok ? 'fail' : (isBehind ? 'warn' : 'ok');
        const pillText = !s.ok ? `Offline (${s.status || 'ERR'})` : (isBehind ? 'Old Commit' : 'Online');
        const liveShort = s.commit ? (s.commit === 'local' ? 'local' : s.commit.slice(0, 7)) : 'Auto (Vercel)';
        const syncText = !s.commit
          ? 'Deployed by Vercel'
          : (!latestSha
              ? `Serving ${liveShort}`
              : (s.commit === latestSha ? 'Up to date with development' : `Behind latest (${latestShort})`));

        return `
          <div class="card">
            <div class="card-head">
              <h3 class="card-title">${esc(s.name)}</h3>
              <span class="pill ${pillClass}">${esc(pillText)}</span>
            </div>
            <div class="meta">
              <div>URL: <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></div>
              <div>Response: HTTP <code>${esc(s.status)}</code> (${esc(s.latencyMs)} ms)</div>
              <div>Running Commit: <code>${esc(liveShort)}</code></div>
              <div>Status: ${esc(syncText)}</div>
            </div>
          </div>`;
      }).join('');

      document.getElementById('branchesGrid').innerHTML = ['development', 'main'].map((b) => {
        const info = data.branches[b];
        const c = info.commit;
        const active = info.activeRun;
        const completed = info.latestCompletedRun;

        let pillClass = 'warn';
        let pillLabel = info.ciRateLimited ? 'CI Rate Limited' : 'Unknown';
        if (active) {
          pillClass = 'warn';
          pillLabel = 'CI Running';
        } else if (completed) {
          pillClass = completed.conclusion === 'success' ? 'ok' : 'fail';
          pillLabel = completed.conclusion === 'success' ? 'CI Passed' : 'CI Failed';
        }

        const displayRun = active || completed;
        const jobs = displayRun?.jobs || [];

        return `
          <div class="card">
            <div class="card-head">
              <h3 class="card-title">Branch: <code>${esc(b)}</code></h3>
              <span class="pill ${pillClass}">${esc(pillLabel)}</span>
            </div>
            <div class="meta">
              ${c ? `
                <div>Latest Commit: <a href="${esc(c.url)}" target="_blank" rel="noopener"><code>${esc(c.shortSha)}</code></a> by ${esc(c.author)}${c.date ? ` (${esc(timeAgo(c.date))})` : ''}</div>
                <div>Message: ${esc(c.message)}</div>
              ` : '<div>Unable to load commit info</div>'}
              ${displayRun ? `<div>CI Run: <a href="${esc(displayRun.url)}" target="_blank" rel="noopener">#${esc(displayRun.id)} (${esc(displayRun.status)}${displayRun.updatedAt ? `, ${esc(timeAgo(displayRun.updatedAt))}` : ''})</a></div>` : (info.ciRateLimited ? '<div><a href="https://github.com/Safe-Passage-ASP-Org/safe_passage/actions" target="_blank" rel="noopener">View GitHub Actions runs</a> (GitHub API rate limit reached on shared IP)</div>' : '')}
              ${jobs.length ? `
                <ul class="job-list">
                  ${jobs.map((j) => {
                    const cls = j.conclusion === 'failure' ? 'fail' : '';
                    const state = j.status !== 'completed' ? j.status : j.conclusion;
                    const steps = j.failedSteps.length ? ` — ${j.failedSteps.join(', ')}` : '';
                    return `<li class="${cls}"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.name)}</a>: ${esc(state)}${esc(steps)}</li>`;
                  }).join('')}
                </ul>
              ` : ''}
            </div>
          </div>`;
      }).join('');
    }

    loadStatus();
  </script>
</body>
</html>
