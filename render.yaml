services:
  - type: web
    name: safepassage-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      - key: Database__Provider
        value: Postgres
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__SigningKey
        generateValue: true
      - key: PayPal__Environment
        value: Sandbox
      - key: PayPal__BaseUrl
        value: https://api-m.sandbox.paypal.com
      - key: PayPal__ClientId
        sync: false
      - key: PayPal__ClientSecret
        sync: false
      - key: PayPal__WebhookId
        sync: false
      - key: PayPal__ReturnUrl
        sync: false
      - key: PayPal__CancelUrl
        sync: false
      - key: PayPal__Plans__pro-monthly__PayPalPlanId
        sync: false
      - key: PayPal__Plans__pro-annual__PayPalPlanId
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: SubscriptionExpirationReminder__Enabled
        value: "false"
      - key: FinanceDemo__LaunchUrl
        value: https://safe-passage-web.onrender.com/finance-demo

  - type: cron
    name: safepassage-subscription-reminders
    runtime: docker
    branch: development
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: dotnet SafePassage.Api.dll --run-subscription-expiration-reminders
    schedule: "0 2 * * *"
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: Postgres
      - key: ConnectionStrings__DefaultConnection
        fromService:
          name: safepassage-api
          type: web
          envVarKey: ConnectionStrings__DefaultConnection
      - key: Brevo__ApiKey
        fromService:
          name: safepassage-api
          type: web
          envVarKey: Brevo__ApiKey
      - key: Brevo__FromAddress
        fromService:
          name: safepassage-api
          type: web
          envVarKey: Brevo__FromAddress
      - key: Frontend__BaseUrl
        value: https://safe-passage-web.onrender.com
      - key: SubscriptionExpirationReminder__Enabled
        value: "true"
      - key: SubscriptionExpirationReminder__LeadTimeDays
        value: "7"

  - type: web
    name: safepassage-web-admin
    runtime: docker
    dockerfilePath: ./frontend-web/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      - key: Api__BaseUrl
        sync: false
